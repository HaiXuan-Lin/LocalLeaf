<?xml version="1.0" encoding="UTF-8"?>
<!-- LocalLeaf app icon: a black leaf on a white tile. Original artwork for this project. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- soft shadow under the tile, so that it has an edge on light backgrounds -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="rib">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M405 619 L650 374" fill="none" stroke="#000" stroke-width="27" stroke-linecap="round"/>
    </mask>
  </defs>
  <!-- macOS icon grid: 824px rounded square centred on a 1024px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#fff" filter="url(#shadow)"/>
  <!-- stem -->
  <path d="M290 734 L367 657" fill="none" stroke="#000" stroke-width="27" stroke-linecap="round"/>
  <!-- blade, with the midrib cut out -->
  <path d="M352 672 C178 422 487 304 734 290 C720 537 602 846 352 672 Z" fill="#000" mask="url(#rib)"/>
</svg>
